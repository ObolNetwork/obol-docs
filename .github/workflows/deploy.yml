name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Allow one concurrent deployment per branch; a newer push cancels an
# in-flight run so we always publish the latest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # PREVIEW MODE: publishes to https://obolnetwork.github.io/obol-docs/
  # (no CNAME, baseUrl /obol-docs/) so the site can be shared while
  # docs.obol.org still points at GitBook.
  #
  # To go to production (docs.obol.org): set DEPLOY_PREVIEW to "false"
  # and point DNS/GitHub Pages custom domain back at this repo.
  DEPLOY_PREVIEW: "true"

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build site
        run: yarn build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build

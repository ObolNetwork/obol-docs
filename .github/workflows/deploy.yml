name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# The deploy step pushes the built site to the gh-pages branch.
permissions:
  contents: write

# Allow one concurrent deployment per branch; a newer push cancels an
# in-flight run so we always publish the latest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# PRODUCTION MODE: builds for https://docs.obol.org at / and ships
# static-prod/CNAME so GitHub Pages keeps the custom domain. To publish a
# shareable preview at https://obolnetwork.github.io/obol-docs/ instead,
# set DEPLOY_PREVIEW to "true" here.
#
# env:
#   DEPLOY_PREVIEW: "true"

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Build site
        run: yarn build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build

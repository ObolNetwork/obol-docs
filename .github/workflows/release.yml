name: Cut a docs version

# Snapshots the current docs/ ("next") into versioned_docs/version-<input>
# and opens a PR. The newest entry in versions.json is automatically served
# at the site root (see docusaurus.config.js); the previous release moves to
# /<version>/ with an "unmaintained" banner.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to cut (e.g. v1.11)"
        required: true

jobs:
  cut-version:
    name: Snapshot docs version
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Cut version
        run: yarn docusaurus docs:version "${{ github.event.inputs.version }}"

      - name: Verify build
        run: yarn build

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: release/${{ github.event.inputs.version }}
          title: "docs: cut version ${{ github.event.inputs.version }}"
          commit-message: "docs: cut version ${{ github.event.inputs.version }}"
          body: |
            Snapshots `docs/` as **${{ github.event.inputs.version }}**.

            Once merged, this version is served at the site root and the
            previous release moves to its own `/<version>/` path.
          add-paths: |
            versioned_docs/
            versioned_sidebars/
            versions.json
